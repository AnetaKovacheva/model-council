[tool.poetry]
name = "model-council"
version = "0.1.0"
description = "Multi-model council: independent drafts, blind peer review, chairman synthesis (LangGraph + Streamlit)"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
langchain = ">=1.0"
langgraph = ">=1.0"
langchain-anthropic = ">=1.0"
langchain-openai = ">=1.0"
langchain-google-genai = ">=3.0"
streamlit = ">=1.40"
pandas = ">=2.2"
python-dotenv = ">=1.0"
pydantic = ">=2.7"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
